name: CI

# Trigger the workflow on push or pull request, but only for the master branch
on:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'


jobs:
  cabal:
    name: ${{ matrix.os }} / ghc ${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ghc: ['9.6.7','9.8.4','9.10.2','9.12.4','9.14.1']

    env:
      CONFIG: "--enable-tests --enable-benchmarks"

    steps:
    - uses: actions/checkout@v4

    - uses: haskell-actions/setup@v2
      id: setup
      name: Setup Haskell tools
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: "latest"
        cabal-update: true

    - name: Configure the build
      run: |
        cabal configure --enable-tests --enable-benchmarks --disable-documentation
        cabal build all --dry-run
      # The last step generates dist-newstyle/cache/plan.json for the cache key.

    - name: Restore cached dependencies
      uses: actions/cache/restore@v4
      id: cache
      env:
        key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ env.key }}-plan-${{ hashFiles('**/plan.json') }}
        restore-keys: ${{ env.key }}-

    - name: Install dependencies
      # If we had an exact cache hit, the dependencies will be up to date.
      if: steps.cache.outputs.cache-hit != 'true'
      run: cabal build all --only-dependencies

    # Cache dependencies already here, so that we do not have to rebuild them should the subsequent steps fail.
    - name: Save cached dependencies
      uses: actions/cache/save@v4
      # If we had an exact cache hit, trying to save the cache would error because of key clash.
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Build
      run: cabal build all

    # The TrueType tests need a font. They fail without one when CI is set.
    - name: Install a TrueType font for the tests
      run: sudo apt-get install -y fonts-dejavu-core

    - name: Run tests
      run: cabal test all

    - name: Run the demo
      run: cabal run HPDF-demo

    # openssl makes a key and a certificate; pdfsig (poppler) verifies the
    # signature of the document, and of the document encrypted then signed.
    - name: Sign a document and verify the signature
      run: |
        sudo apt-get install -y poppler-utils
        openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem \
          -out certificates.pem -days 2 -subj "/CN=HPDF CI"
        cabal run HPDF-Sign-Demo -- key.pem certificates.pem
        pdfsig signed.pdf | tee pdfsig.txt
        grep -q 'Signature Validation: Signature is Valid' pdfsig.txt
        grep -q 'Total document signed' pdfsig.txt
        pdfsig -upw user encrypted-signed.pdf | tee pdfsig-encrypted.txt
        grep -q 'Signature Validation: Signature is Valid' pdfsig-encrypted.txt
        grep -q 'Total document signed' pdfsig-encrypted.txt
        pdfinfo -upw user encrypted-signed.pdf | grep -q 'algorithm:AES-256'

    # veraPDF is the reference validator for PDF/A.
    - name: Validate the PDF/A demo with veraPDF
      run: |
        sudo apt-get install -y colord-data
        cabal run HPDF-PDFA-Demo
        mkdir verapdf-in
        mv pdfa.pdf verapdf-in/
        docker run --rm --network none -v "$PWD/verapdf-in:/data:ro" \
          verapdf/cli --flavour 3b --format text /data/pdfa.pdf | tee verapdf.txt
        # Do not rely on the exit status of the image: read the verdict.
        grep -q '^PASS' verapdf.txt
        if grep -q '^FAIL' verapdf.txt; then exit 1; fi
